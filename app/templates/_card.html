<article class="card" draggable="true" data-job-id="{{ job.id }}">
  <div class="card-top">
    <span class="badge badge-{{ job.match_label or 'pruefen' }}" title="{{ job.match_reason }}">{{ job.match_label_text() }} · {{ job.match_percent() }} %</span>
  </div>
  <a class="card-title" href="{{ url_for('board.job_detail', job_id=job.id) }}">{{ job.title }}</a>
  <div class="card-meta">
    {{ job.company or "Firma unbekannt" }}{% if job.location %} · {{ job.location }}{% endif %}
  </div>
  <div class="card-source">{{ job.source|source_label }}</div>
  {% if job.document_checklist() %}
  <div class="card-docs" title="Geforderte Unterlagen">{{ job.document_checklist()|join(' · ') }}</div>
  {% endif %}
  <div class="card-actions">
    <form action="{{ url_for('board.update_status', job_id=job.id) }}" method="post" class="inline-form">
      <input type="hidden" name="next" value="{{ url_for('board.board') }}">
      <select name="status" onchange="this.form.submit()" aria-label="Spalte">
        {% for key, label in status_flow %}
        <option value="{{ key }}" {% if key == job.status %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </form>
    <form action="{{ url_for('board.delete_job', job_id=job.id) }}" method="post" class="inline-form js-archive">
      <input type="hidden" name="next" value="{{ url_for('board.board') }}">
      <button type="submit" class="ghost small" title="Ins Archiv (nicht interessant)">Löschen</button>
    </form>
  </div>
</article>
