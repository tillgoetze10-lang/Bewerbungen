<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Bewerbungen{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('board.board') }}">Bewerbungs-Board</a>
    <nav>
      <a href="{{ url_for('board.board') }}">Board</a>
      <a href="{{ url_for('board.archive') }}">Archiv</a>
      <a href="{{ url_for('board.documents') }}">Meine Unterlagen</a>
      <a href="{{ url_for('board.companies') }}">Firmen</a>
      <a href="{{ url_for('board.add_job') }}">+ Job hinzufuegen</a>
      <form action="{{ url_for('board.fetch_now') }}" method="post" style="display:inline">
        <button type="submit">Jetzt nach neuen Jobs suchen</button>
      </form>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
