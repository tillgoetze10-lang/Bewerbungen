<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Bewerbungen{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('board.board') }}">Bewerbungs-Board</a>

    <nav class="nav-links">
      <a href="{{ url_for('board.board') }}" class="{{ 'active' if request.endpoint == 'board.board' }}">Board</a>
      <a href="{{ url_for('board.archive') }}" class="{{ 'active' if request.endpoint == 'board.archive' }}">Archiv</a>
      <a href="{{ url_for('board.documents') }}" class="{{ 'active' if request.endpoint == 'board.documents' }}">Meine Unterlagen</a>
      <a href="{{ url_for('board.companies') }}" class="{{ 'active' if request.endpoint == 'board.companies' }}">Firmen</a>
      <a href="{{ url_for('board.status') }}" class="{{ 'active' if request.endpoint == 'board.status' }}">Status</a>
    </nav>

    <div class="nav-actions">
      <a class="btn-ghost" href="{{ url_for('board.add_job') }}">+ Job hinzufuegen</a>
      <form action="{{ url_for('board.fetch_now') }}" method="post">
        <button type="submit" class="btn-primary">Jetzt nach neuen Jobs suchen</button>
      </form>
    </div>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
