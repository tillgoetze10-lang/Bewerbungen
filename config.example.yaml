# Technische Einstellungen (optional). Suchprofile, Quellen und API-Schlüssel
# pflegst du bequem in der App unter "Einstellungen" – hier musst du nichts ändern.

# Wie oft automatisch gesucht wird, solange die App läuft (Minuten, 0 = nie).
fetch_interval_minutes: 60

# Kurz nach dem Start der App einmal suchen.
fetch_on_startup: true

# Für jeden neuen Job die Anzeige öffnen und Aufgaben/Kontakt/Unterlagen auslesen.
fetch_job_details: true

http_timeout_seconds: 15

# Mac-Mitteilung, wenn ein Suchlauf neue Top-Treffer findet.
notify_new_top: true

# Nach wie vielen Tagen nach "Beworben" an das Nachfassen erinnert wird.
follow_up_days: 14
